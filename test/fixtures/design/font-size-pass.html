<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Font Size Pass</title>
<style>
  body { font-family: sans-serif; margin: 2em; }
  p  { font-size: 16px; }
  li { font-size: 16px; }
  td { font-size: 16px; }
  th { font-size: 16px; }
  dd { font-size: 16px; }
  dt { font-size: 16px; }
  figcaption { font-size: 16px; }
  label { font-size: 16px; }
  span { font-size: 16px; }
  a   { font-size: 16px; }
  button { font-size: 16px; }
  div { font-size: 16px; }
  input { font-size: 16px; }
</style></head><body>
  <h1>Font Size Pass Test</h1>
  <p>This paragraph is 16px — acceptable.</p>
  <ul><li>List item at 16px</li></ul>
  <table><tr><td>Table cell 16px</td><th>Header 16px</th></tr></table>
  <dl><dt>Term 16px</dt><dd>Definition 16px</dd></dl>
  <figure><figcaption>Caption 16px</figcaption></figure>
  <label for="x">Label 16px</label><input id="x">
  <span>A span at 16px</span>
  <a href="#">Link 16px</a>
  <button>Button 16px</button>
  <div>A div with 16px text</div>
</body></html>
