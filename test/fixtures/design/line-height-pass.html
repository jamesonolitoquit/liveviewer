<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Line Height Pass</title>
<style>
  body { font-family: sans-serif; font-size: 16px; margin: 2em; }
  p  { line-height: 1.5; }
  li { line-height: 1.5; }
  td { line-height: 1.5; }
  th { line-height: 1.5; }
  dd { line-height: 1.5; }
  dt { line-height: 1.5; }
  figcaption { line-height: 1.5; }
  label { line-height: 1.5; }
  span { line-height: 1.5; }
  a   { line-height: 1.5; }
  button { line-height: 1.5; font-size: 16px; }
  label { line-height: 1.5; font-size: 16px; }
  div { line-height: 1.5; }
</style></head><body>
  <h1>Line Height Pass Test</h1>
  <p>Paragraph with line-height 1.5 — good.</p>
  <ul><li>List item lh 1.5</li></ul>
  <table><tr><td>Cell lh 1.5</td><th>Header lh 1.5</th></tr></table>
  <dl><dt>Term lh 1.5</dt><dd>Def lh 1.5</dd></dl>
  <figure><figcaption>Caption lh 1.5</figcaption></figure>
  <label>Label lh 1.5</label>
  <span>Span lh 1.5</span>
  <a href="#">Link lh 1.5</a>
  <button>Button lh 1.5</button>
  <div>Div lh 1.5</div>
</body></html>
