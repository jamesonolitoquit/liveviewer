name: Keep Vercel warm
on:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Vercel function
        run: |
          curl -sSf -X POST \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","wcag":false,"design":false}' \
            "${{ vars.VERCEL_URL || 'https://jao-liveviewer.vercel.app' }}/api/audit" \
            > /dev/null
